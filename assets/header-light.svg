<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Lucas Gomes — Desenvolvedor full stack, back-end e IA generativa">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#E4E0EC"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0.45" stop-color="#FBFAFD"/><stop offset="1" stop-color="#FBFAFD" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform:scaleX(0);animation:grow .9s .5s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .ph{opacity:0;animation:type 12s infinite both}
    .p2{animation-delay:4s}.p3{animation-delay:8s}
    @keyframes type{0%{opacity:1;clip-path:inset(0 100% 0 0)}14%{clip-path:inset(0 0 0 0)}29%{opacity:1;clip-path:inset(0 0 0 0)}33%,100%{opacity:0;clip-path:inset(0 0 0 0)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}.p2,.p3{display:none}}
  </style>
  <rect width="900" height="220" rx="12" fill="#FBFAFD"/>
  <rect x="420" width="480" height="220" fill="url(#dots)"/>
  <rect x="420" width="480" height="220" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="899" height="219" rx="12" fill="none" stroke="#E4E0EC"/>

  <g class="up d1"><text x="48" y="56" class="mono" font-size="14" fill="#5E566E">~/lucasg0m7s · Nova Odessa, SP</text></g>
  <g class="up d2"><text x="46" y="120" class="sans" font-size="54" font-weight="600" letter-spacing="-1.2" fill="#1B1426">Lucas Gomes</text></g>
  <rect class="bar" x="48" y="140" width="56" height="3" rx="1.5" fill="#6D28D9"/>

  <g class="up d3">
    <text x="48" y="180" class="mono" font-size="17" fill="#6D28D9">&gt;</text>
    <text x="68" y="180" class="mono ph p1" font-size="17" fill="#1B1426">desenvolvedor full stack, mais forte no back-end</text>
    <text x="68" y="180" class="mono ph p2" font-size="17" fill="#1B1426">construindo canais digitais para bancos</text>
    <text x="68" y="180" class="mono ph p3" font-size="17" fill="#1B1426">aprendendo IA generativa e machine learning</text>
    <rect class="caret" x="48" y="186" width="10" height="2" fill="#6D28D9"/>
  </g>

  <g class="up d3">
    <circle class="pulse" cx="742" cy="51" r="4" fill="#6D28D9"/>
    <circle cx="742" cy="51" r="4" fill="#6D28D9"/>
    <text x="754" y="56" class="mono" font-size="13" fill="#5E566E">desde 2022</text>
  </g>
</svg>
